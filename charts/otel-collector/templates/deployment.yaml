apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "otel-collector.fullname" . }}
  labels:
    {{- include "otel-collector.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: {{ .Values.rollingUpdate.maxUnavailable }}
      maxSurge: {{ .Values.rollingUpdate.maxSurge }}
  selector:
    matchLabels:
      {{- include "otel-collector.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "otel-collector.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ include "otel-collector.name" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: otlp-grpc
              containerPort: {{ .Values.service.otlpGrpcPort }}
              protocol: TCP
            - name: otlp-http
              containerPort: {{ .Values.service.otlpHttpPort }}
              protocol: TCP
            - name: health
              containerPort: {{ .Values.service.healthCheckPort }}
              protocol: TCP
          env:
            - name: NEW_RELIC_OTLP_ENDPOINT
              value: {{ .Values.otelConfig.newRelicOtlpEndpoint | quote }}
            - name: SIGNOZ_OTLP_ENDPOINT
              value: {{ .Values.otelConfig.signozOtlpEndpoint | quote }}
            - name: SIGNOZ_OTLP_INSECURE
              value: {{ .Values.otelConfig.signozOtlpInsecure | quote }}
            - name: DEPLOY_ENV
              value: {{ .Values.otelConfig.deployEnv | quote }}
            - name: NEW_RELIC_LICENSE_KEY
              {{- if .Values.newRelicLicenseKey.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.newRelicLicenseKey.existingSecret }}
                  key: {{ .Values.newRelicLicenseKey.existingSecretKey }}
              {{- else }}
              value: {{ .Values.newRelicLicenseKey.value | quote }}
              {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: health
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: health
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
